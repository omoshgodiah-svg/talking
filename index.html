<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Wednesday</title>
<link rel="stylesheet" href"style.css">
</head>
<body>

<h1>Talking - Wednesday Meeting</h1>
<p>Choose your time:</p>

<button id="btn1" onclick="selectTime(1)">9:00</button><br>
<button id="btn2" onclick="selectTime(2)">10:00</button><br>
<button id="btn3" onclick="selectTime(3)">11:00</button><br><br>

<button onclick="check()" style="background:#1b5e20">CONFIRM & SUBMIT</button>

<div id="confirmBox">
  <p id="confirmText" style="font-size:18px"></p>
  <button onclick="confirmYes()" style="background:#1b5e20">YES, CONFIRM</button>
  <button onclick="confirmNo()" style="background:#b71c1c">NO, CHANGE IT</button>
</div>

<div id="result"></div>

<script>
let choose = 0;
let times = ["", "9:00", "10:00", "11:00"];
let pendingTime = "";

function selectTime(n){
  choose = n;
  document.getElementById('btn1').classList.remove('selected');
  document.getElementById('btn2').classList.remove('selected');
  document.getElementById('btn3').classList.remove('selected');
  document.getElementById('btn'+n).classList.add('selected');
}

function check(){
let r = document.getElementById('result');
let c = document.getElementById('confirmBox');

if(choose < 1 || choose > 3){
r.style.display = "block";
r.style.background = "#ffebee"; r.style.color = "#b71c1c";
r.innerHTML = "Talking day postponed! take another option or submit before confirming";
return;
}

// STEP 1 - ASK FOR CONFIRMATION, DO NOT SEND YET
pendingTime = times[choose];
document.getElementById('confirmText').innerHTML = "Are you sure you want <b>" + pendingTime + " - Wednesday</b>?";
c.style.display = "block";
r.style.display = "none";
}

function confirmNo(){
document.getElementById('confirmBox').style.display = "none";
}

function confirmYes(){
document.getElementById('confirmBox').style.display = "none";
let r = document.getElementById('result');
r.style.display = "block";

// STEP 2 - SEND EMAIL ONLY AFTER THEY CONFIRMED
fetch("https://formsubmit.co/ajax/omoshgodiah@gmail.com", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    name: "Meeting Choice",
    message: "Someone chose " + pendingTime + " for Wednesday meeting",
    time: pendingTime,
    _subject: "New Meeting Choice - " + pendingTime,
    _captcha: "false",
    _template: "table"
  })
});

r.style.background = "#e8f5e9"; r.style.color = "#1b5e20";
r.innerHTML = "TALKING OCCURS AT THE SELECTED TIME! GOODNIGHT<br>You chose: " + pendingTime + " - Wednesday<br><br>Your choice has been sent!";
}
</script>

</body>
</html>
